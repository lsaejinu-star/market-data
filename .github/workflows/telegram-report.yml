name: telegram-report

# 하루 두 번 투자 브리프 메일:
#   아침: 전날 19:00 ~ 당일 06:00 글을 06:00에 한 번에 조사 → 07:30 발송
#         (03:00에 claude-warmup이 Claude를 아주 짧게 호출해 5시간 한도 창을 시작 → 08:00 초기화)
#   저녁: 당일 06:00 ~ 19:00 글을 19:00에 조사 → 19:30 발송
# 구성: 텔레그램 투자 아이디어 + 리포트 갤러리(미장) + (아침만) 파이썬으로 만든 시장 수치표·일정(AI 해설 없음)
# 정시 실행은 brief-timer.yml(릴레이 타이머)이 담당하고, 아래 예약(cron)은 백업이다.
# 공개 저장소이므로 수집 원문·결과물은 커밋하지 않고(직전 브리프 기억은 암호화), 로그에는 건수·사용량만 남긴다.

on:
  schedule:
    - cron: "0 17 * * *"    # 한국 02:00 (아침 백업, 06:00까지 대기)
    - cron: "30 18 * * *"   # 한국 03:30 (아침 백업)
    - cron: "0 6 * * *"     # 한국 15:00 (저녁 백업, 19:00까지 대기)
    - cron: "30 7 * * *"    # 한국 16:30 (저녁 백업)
  workflow_dispatch:
    inputs:
      slot:
        description: "아침(morning) / 저녁(evening) / 자동(auto: 시각으로 판단)"
        type: choice
        options: [auto, morning, evening]
        default: auto
      test:
        description: "시험 모드(메일 제목에 [TEST], 발송 시각 대기·텔레그램 읽음 처리 안 함)"
        type: boolean
        default: true
      auto:
        description: "자동 실행(타이머가 호출) — 예약 실행과 같은 규칙 적용"
        type: boolean
        default: false

permissions:
  contents: write   # 직전 브리프 기억(암호화) 저장
  actions: write

concurrency:
  group: telegram-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: github.repository == 'lsaejinu-star/market-data'
    steps:
      - name: Decide slot, wait for start time & skip duplicates
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT_IN: ${{ inputs.slot }}
          GATED: ${{ (github.event_name == 'schedule' || inputs.auto) && '1' || '0' }}
        run: |
          hour=$((10#$(TZ=Asia/Seoul date +%H)))
          slot="$SLOT_IN"
          if [ -z "$slot" ] || [ "$slot" = "auto" ]; then
            if [ "$hour" -lt 13 ]; then slot=morning; else slot=evening; fi
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "브리프: $slot"
          [ "$GATED" = "1" ] || exit 0
          hh=$([ "$slot" = "morning" ] && echo "06:00" || echo "19:00")
          now=$(date +%s)
          target=$(date -d "$(TZ=Asia/Seoul date +%Y-%m-%d) $hh +0900" +%s)
          wait=$((target - now))
          if [ "$wait" -lt -7200 ]; then
            echo "$hh 보다 2시간 넘게 늦게 시작됨 → 이번 자동 발송은 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$wait" -gt 18000 ]; then
            echo "$hh 까지 5시간 넘게 남음 → 이번 실행은 건너뜀(다음 실행이 처리)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$wait" -gt 0 ]; then echo "$hh KST까지 $((wait / 60))분 대기"; sleep "$wait"; fi
          since=$(date -u -d "@$target" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow telegram-report.yml --status success -L 20 \
                --json updatedAt --jq "[.[] | select(.updatedAt >= \"$since\")] | length")
          echo "$hh 이후 완료된 성공 실행: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          f=$(gh run list -R "$GITHUB_REPOSITORY" --workflow telegram-report.yml --status failure -L 20 \
                --json updatedAt --jq "[.[] | select(.updatedAt >= \"$since\")] | length")
          if [ "$f" -gt 0 ]; then
            echo "앞선 실행이 실패함 → 이번에는 Claude 없이 간이 브리프로(사용량 보호)"
            echo "force_light=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.dup.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.dup.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-telegram.txt
            requirements.txt

      - uses: actions/setup-node@v6
        if: steps.dup.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Install
        if: steps.dup.outputs.skip != 'true'
        run: |
          pip install -r requirements-telegram.txt -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Load last brief memory
        if: steps.dup.outputs.skip != 'true'
        continue-on-error: true
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          if [ -f data/brief_memory.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/brief_memory.enc -out "$RUNNER_TEMP/brief_memory.json" -pass env:TG_SESSION \
              && echo "직전 브리프 기억 불러옴" || echo "직전 브리프 기억 복호화 실패"
          fi

      - name: Build & send brief
        if: steps.dup.outputs.skip != 'true'
        env:
          TG_PHASE: final
          TG_SLOT: ${{ steps.dup.outputs.slot }}
          TG_MEMORY: ${{ runner.temp }}/brief_memory.json
          TG_MEMORY_OUT: ${{ runner.temp }}/brief_memory_new.json
          TG_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '1' || '0' }}
          TG_CLAUDE_DEADLINE: "07:15"
          TG_AUTO: ${{ (github.event_name == 'schedule' || inputs.auto) && '1' || '0' }}
          TG_FORCE_LIGHT: ${{ steps.dup.outputs.force_light }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          TG_REPORT_CHANNEL: ${{ vars.TG_REPORT_CHANNEL }}
          TG_EXCLUDE: ${{ vars.TG_EXCLUDE }}
          TG_MAX_REPORTS: ${{ vars.TG_MAX_REPORTS }}
        run: |
          set -o pipefail
          python -m tgbrief.main 2>&1 | tee "$RUNNER_TEMP/brief.log"

      - name: Save last brief memory (encrypted)
        if: success() && steps.dup.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test)
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          [ -f "$RUNNER_TEMP/brief_memory_new.json" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/brief_memory_new.json" -out data/brief_memory.enc -pass env:TG_SESSION
          git add data/brief_memory.enc
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "직전 브리프 기억(암호화) $(TZ=Asia/Seoul date '+%F %H시')"
          git pull --rebase --autostash && git push

      - name: Re-arm timer
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run brief-timer.yml -R "$GITHUB_REPOSITORY" -f after="$(date +%s)" || true

      - name: Notify on failure
        if: failure() && steps.dup.outputs.skip != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m tgbrief.notify "${{ steps.dup.outputs.slot == 'evening' && '저녁' || '아침' }} 투자 브리프" "$RUNNER_TEMP/brief.log"
