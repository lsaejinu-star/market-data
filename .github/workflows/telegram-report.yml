name: telegram-report

# 매일: 구독 채널 + 리포트 갤러리 수집 → Claude(구독, Claude Code CLI) 분석 → 슬라이드형 HTML 메일 발송
# 공개 저장소이므로 아무것도 커밋/업로드하지 않고, 로그에는 건수·사용량만 남긴다.

on:
  schedule:
    - cron: "47 21 * * *"   # 매일 21:47 UTC = 한국 06:47
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'lsaejinu-star/market-data'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-telegram.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          pip install -r requirements-telegram.txt
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Build & send brief
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          TG_REPORT_CHANNEL: ${{ vars.TG_REPORT_CHANNEL }}
          TG_MAX_REPORTS: ${{ vars.TG_MAX_REPORTS }}
        run: python -m tgbrief.main
