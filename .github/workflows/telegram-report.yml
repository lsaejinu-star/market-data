name: telegram-report

# 매일: 전날 07:00~당일 06:00 KST 구독 채널 + 리포트 갤러리 수집, 미국장 시세·금리·지표·일정 수집
# → Claude(구독, Claude Code CLI) 분석·매크로 해설(웹 검색) → 하나의 슬라이드형 HTML을 07:30에 메일 발송
# 03:00 이전 글은 1단계(telegram-prep.yml)가 03:00에 미리 요약해 둔 결과를 이어받는다(Claude 5시간 한도가 08:00에 초기화되도록).
# 공개 저장소이므로 아무것도 커밋/업로드하지 않고, 로그에는 건수·사용량만 남긴다.

on:
  # GitHub 예약 실행은 이 저장소에서 4~6시간씩 늦게 시작되는 경우가 많다.
  # 그래서 새벽에 여러 번 걸어두고, 06:00 전에 시작된 실행은 06:00까지 기다렸다가 수집한다.
  # 그날 이미 발송된 뒤에 도착한 실행은 아무것도 하지 않는다(중복 발송 방지).
  schedule:
    - cron: "0 17 * * *"    # 한국 02:00
    - cron: "30 18 * * *"   # 한국 03:30
    - cron: "5 21 * * *"    # 한국 06:05
  workflow_dispatch:
    inputs:
      test:
        description: "시험 모드(메일 제목에 [TEST], 발송 시각 대기·텔레그램 읽음 처리 안 함)"
        type: boolean
        default: true
      auto:
        description: "자동 실행(타이머가 호출) — 예약 실행과 같은 규칙 적용"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: telegram-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: github.repository == 'lsaejinu-star/market-data'
    steps:
      - name: Wait for 06:00 KST & skip if today's brief was already sent
        id: dup
        if: github.event_name == 'schedule' || inputs.auto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          target=$(date -d "$(TZ=Asia/Seoul date +%Y-%m-%d) 06:00 +0900" +%s)
          wait=$((target - now))
          if [ "$wait" -lt -10800 ]; then
            echo "09:00 KST 이후에 시작됨 → 오늘 자동 발송은 건너뜀(업무 시간 Claude 한도 보호)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$wait" -gt 18000 ]; then
            echo "06:00 KST까지 5시간 넘게 남음 → 이번 실행은 건너뜀(다음 예약 실행이 처리)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$wait" -gt 0 ]; then
            echo "06:00 KST까지 $((wait / 60))분 대기"; sleep "$wait"
          fi
          since=$(date -u -d "$(TZ=Asia/Seoul date +%Y-%m-%d) 06:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow telegram-report.yml --status success -L 20 \
                --json updatedAt --jq "[.[] | select(.updatedAt >= \"$since\")] | length")
          echo "오늘 06:00 KST 이후 완료된 성공 실행: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v6
        if: steps.dup.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.dup.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-telegram.txt
            requirements.txt

      - uses: actions/setup-node@v6
        if: steps.dup.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Install
        if: steps.dup.outputs.skip != 'true'
        run: |
          pip install -r requirements-telegram.txt -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Load 03:00 prep state
        if: steps.dup.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          since=$(date -u -d "$(TZ=Asia/Seoul date +%Y-%m-%d) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow telegram-prep.yml --status success -L 10 \
                  --json databaseId,updatedAt --jq ".[] | select(.updatedAt >= \"$since\") | .databaseId")
          for id in $ids; do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n prep-state -D "$RUNNER_TEMP/prep" 2>/dev/null; then
              openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/prep/prep_state.enc" -out "$RUNNER_TEMP/prep_state.json" -pass env:TG_SESSION \
                && echo "1단계 결과 사용 (run $id)" && break
            fi
          done
          [ -f "$RUNNER_TEMP/prep_state.json" ] || echo "1단계 결과 없음 → 전 구간을 이번에 처리"

      - name: Build & send brief
        if: steps.dup.outputs.skip != 'true'
        env:
          TG_PHASE: final
          TG_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '1' || '0' }}
          TG_CLAUDE_DEADLINE: "07:15"
          TG_AUTO: ${{ (github.event_name == 'schedule' || inputs.auto) && '1' || '0' }}
          TG_STATE: ${{ runner.temp }}/prep_state.json
          TG_PREP_AT: "03:00"
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          TG_REPORT_CHANNEL: ${{ vars.TG_REPORT_CHANNEL }}
          TG_EXCLUDE: ${{ vars.TG_EXCLUDE }}
          TG_MAX_REPORTS: ${{ vars.TG_MAX_REPORTS }}
          TG_SEND_AT: "07:30"
          TG_WINDOW_START: "07:00"
          TG_WINDOW_END: "06:00"
        run: |
          set -o pipefail
          python -m tgbrief.main 2>&1 | tee "$RUNNER_TEMP/brief.log"

      - name: Re-arm next-day timer
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run brief-timer.yml -R "$GITHUB_REPOSITORY" -f stage=prep || true

      - name: Notify on failure
        if: failure() && steps.dup.outputs.skip != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m tgbrief.notify "오늘 투자 브리프" "$RUNNER_TEMP/brief.log"
