name: market-data

on:
  schedule:
    # 미국장 마감 후 두 번 실행 (평일, UTC 기준)
    # 20:20 UTC = 서머타임 기간 마감(20:00 UTC) 20분 후 / 한국 05:20
    # 21:15 UTC = 표준시 기간 마감(21:00 UTC) 15분 후 / 한국 06:15
    - cron: "20 20 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch: # Actions 탭에서 수동 실행 가능
  push: # 스크립트·설정을 바꾸면 바로 한 번 실행 (data 커밋은 제외)
    branches: [main]
    paths:
      - "fetch_market.py"
      - "requirements.txt"
      - ".github/workflows/market-data.yml"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python fetch_market.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_latest.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "market data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
