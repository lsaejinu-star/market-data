name: market-data

on:
  # 투자 브리프(telegram-report)가 같은 수집 스크립트를 작업 안에서 직접 실행하므로
  # 이 워크플로의 매일 예약·push 실행은 껐다(데이터 커밋 중단). 필요하면 Actions 탭에서 수동 실행.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # 각 수집은 독립적으로 실행: 하나가 실패해도 나머지는 저장된다
      - name: Fetch market data
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_market.py

      - name: Fetch macro (FRED)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_macro.py

      - name: Compute breadth (S&P500)
        continue-on-error: true
        timeout-minutes: 10
        run: python fetch_breadth.py

      - name: Fetch telegram
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_telegram.py

      - name: Fetch news (auctions, central banks, holdings)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_news.py

      - name: Fetch KRW official rate (ECOS)
        continue-on-error: true
        timeout-minutes: 3
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python fetch_ecos.py

      - name: Build YTD history
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_history.py

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
