name: claude-warmup

# 03:00 KST에 Claude를 아주 짧게 한 번 호출해(조사 없음) 구독 5시간 한도 창을 03:00에 시작시킨다
# → 06:00 아침 브리프 작업이 이 창 안에서 끝나고, 한도는 08:00에 초기화된다.
# (파일 이름은 기존 실행 기록·타이머 호환을 위해 telegram-prep.yml 유지)

on:
  # 정시 실행은 brief-timer.yml이 담당. 아래 예약은 백업(GitHub 예약은 몇 시간씩 늦을 수 있어 미리 걸고 03:00까지 대기).
  schedule:
    - cron: "30 13 * * *"   # 한국 22:30
    - cron: "0 15 * * *"    # 한국 00:00
    - cron: "30 16 * * *"   # 한국 01:30
  workflow_dispatch:
    inputs:
      auto:
        description: "자동 실행(타이머가 호출) — 03:00까지 대기·중복 확인 적용"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: telegram-prep
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: github.repository == 'lsaejinu-star/market-data'
    steps:
      - name: Wait for 03:00 KST & skip duplicates
        id: gate
        if: github.event_name == 'schedule' || inputs.auto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          day=$(TZ=Asia/Seoul date +%Y-%m-%d)
          target=$(date -d "$day 03:00 +0900" +%s)
          # 한국 06:00이 지났으면 다음 날 03:00이 목표
          if [ $((now - target)) -gt 10800 ]; then target=$((target + 86400)); fi
          wait=$((target - now))
          if [ "$wait" -gt 18000 ]; then echo "03:00까지 5시간 넘게 남음 → 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 05:55 이후면 의미 없음(06:00 브리프가 곧 Claude를 쓰기 시작)
          if [ "$wait" -lt -10500 ]; then echo "05:55 이후 도착 → 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "@$((target - 1800))" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow telegram-prep.yml --status success -L 20 \
                --json updatedAt,conclusion --jq "[.[] | select(.updatedAt >= \"$since\")] | length")
          if [ "$n" -gt 0 ]; then echo "오늘 활성화가 이미 완료됨 → 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 03:00 전에는 절대 호출하지 않는다(그러면 한도 창이 일찍 시작돼 06:00 작업이 새 창을 연다)
          if [ "$wait" -gt 0 ]; then echo "03:00 KST까지 $((wait / 60))분 대기"; sleep "$wait"; fi

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Warm up Claude (one tiny call)
        if: steps.gate.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          cd "$RUNNER_TEMP"
          for i in 1 2 3; do
            if echo "Reply with OK only." | claude -p --model claude-haiku-5-5 --max-turns 1 --tools "" \
                 --setting-sources "" --strict-mcp-config --output-format json > out.json 2> err.txt; then
              python3 -c "import json;d=json.load(open('out.json'));print('활성화 완료:', d.get('result','')[:20], '· 토큰', d.get('usage',{}).get('output_tokens'))"
              exit 0
            fi
            echo "호출 실패 → 30초 후 재시도 $i/3"; sleep 30
          done
          tail -3 err.txt; exit 1

      - name: Re-arm timer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run brief-timer.yml -R "$GITHUB_REPOSITORY" -f after="$(date +%s)" || true
