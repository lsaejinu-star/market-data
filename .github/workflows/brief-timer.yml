name: brief-timer

# GitHub 예약(cron) 실행은 몇 시간씩 늦거나 아예 빠지는 날이 있어(11/10 새벽 6개 모두 미실행),
# 이 워크플로가 스스로를 이어 실행(릴레이)하며 정확한 시각에 1단계·2단계를 직접 실행시킨다.
#   stage=prep  → 03:00 KST까지 기다렸다가 telegram-prep 실행 → stage=final 타이머를 건다
#   stage=final → 06:00 KST까지 기다렸다가 telegram-report 실행 → 다음 날 stage=prep 타이머를 건다
# 한 번에 최대 5시간만 기다리고, 더 남았으면 자기 자신을 다시 실행해 이어서 기다린다.
# 동시에 하나만 돌도록 concurrency로 묶었다(새 타이머가 시작되면 이전 타이머는 취소).
# 예약(cron)은 백업으로 남아 있고, 이미 실행된 단계는 각 워크플로가 중복 확인 후 건너뛴다.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "다음에 실행할 단계"
        type: choice
        options: [prep, final]
        default: prep

permissions:
  contents: read
  actions: write

concurrency:
  group: brief-timer
  cancel-in-progress: true

jobs:
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: github.repository == 'lsaejinu-star/market-data'
    steps:
      - name: Wait and hand off
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
        run: |
          R="$GITHUB_REPOSITORY"
          hh=$([ "$STAGE" = "prep" ] && echo "03:00" || echo "06:00")
          now=$(date +%s)
          target=$(date -d "$(TZ=Asia/Seoul date +%Y-%m-%d) $hh +0900" +%s)
          # 목표 시각이 30분 넘게 지났으면 다음 날 같은 시각
          if [ "$now" -gt $((target + 1800)) ]; then target=$((target + 86400)); fi
          wait=$((target - now))
          echo "단계 $STAGE · 목표 $(TZ=Asia/Seoul date -d @$target '+%m-%d %H:%M') KST · 남은 시간 $((wait / 60))분"
          if [ "$wait" -gt 19800 ]; then
            sleep 18000
            echo "5시간 대기 후 이어서 대기(릴레이)"
            gh workflow run brief-timer.yml -R "$R" -f stage="$STAGE"
            exit 0
          fi
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          if [ "$STAGE" = "prep" ]; then
            gh workflow run telegram-prep.yml -R "$R" -f auto=true
            gh workflow run brief-timer.yml -R "$R" -f stage=final
          else
            gh workflow run telegram-report.yml -R "$R" -f auto=true -f test=false
            gh workflow run brief-timer.yml -R "$R" -f stage=prep
          fi
