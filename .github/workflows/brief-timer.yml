name: brief-timer

# GitHub 예약(cron)은 몇 시간씩 늦거나 빠지는 날이 있어, 이 워크플로가 스스로를 이어 실행(릴레이)하며 정시에 직접 실행시킨다.
#   03:00 KST → claude-warmup(telegram-prep.yml): Claude 아주 짧게 1회 호출(5시간 한도 창 시작 → 08:00 초기화)
#   06:00 KST → telegram-report 아침 브리프(전날 19:00~06:00 글, 07:30 발송)
#   19:00 KST → telegram-report 저녁 브리프(06:00~19:00 글, 19:30 발송)
# 다음 일정은 매번 현재 시각으로 계산한다(어디서 다시 걸어도 항상 올바른 다음 일정을 기다림).
# 한 번에 최대 5시간만 기다리고, 더 남았으면 자기 자신을 다시 실행해 이어서 기다린다.
# 동시에 하나만 돌도록 concurrency로 묶었다. 각 워크플로가 실행 후 이 타이머를 다시 걸고, 아래 예약은 감시용 백업이다.

on:
  schedule:
    - cron: "17 */4 * * *"   # 감시: 체인이 끊겼으면 다시 잇는다(이어 있으면 같은 일정을 다시 기다릴 뿐)
  workflow_dispatch:
    inputs:
      after:
        description: "이 시각(epoch 초) 이후의 일정만 고려(직전에 실행한 일정을 다시 실행하지 않도록, 내부용)"
        required: false
        default: "0"
      stage:
        description: "(예전 입력, 무시됨)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: brief-timer
  cancel-in-progress: true

jobs:
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: github.repository == 'lsaejinu-star/market-data'
    steps:
      - name: Wait for the next event and hand off
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ inputs.after || '0' }}
        run: |
          R="$GITHUB_REPOSITORY"
          now=$(date +%s)
          floor=$((now - 600)); [ "$AFTER" -gt "$floor" ] 2>/dev/null && floor=$AFTER
          best=""; kind=""
          for d in 0 1; do
            day=$(TZ=Asia/Seoul date -d "@$((now + d * 86400))" +%Y-%m-%d)
            for ev in "03:00 warmup" "06:00 morning" "19:00 evening"; do
              t=$(date -d "$day ${ev% *} +0900" +%s)
              if [ "$t" -gt "$floor" ] && { [ -z "$best" ] || [ "$t" -lt "$best" ]; }; then best=$t; kind=${ev#* }; fi
            done
          done
          wait=$((best - now))
          echo "다음 일정: $kind · $(TZ=Asia/Seoul date -d @$best '+%m-%d %H:%M') KST · 남은 시간 $((wait / 60))분"
          if [ "$wait" -gt 19800 ]; then
            sleep 18000
            echo "5시간 대기 후 이어서 대기(릴레이)"
            gh workflow run brief-timer.yml -R "$R" -f after="$AFTER"
            exit 0
          fi
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          case "$kind" in
            warmup)  gh workflow run telegram-prep.yml -R "$R" -f auto=true ;;
            morning) gh workflow run telegram-report.yml -R "$R" -f auto=true -f test=false -f slot=morning ;;
            evening) gh workflow run telegram-report.yml -R "$R" -f auto=true -f test=false -f slot=evening ;;
          esac
          gh workflow run brief-timer.yml -R "$R" -f after="$best"
